<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="Рабочее пространство CRM-системы для сервисного бизнеса."
    />
    <title>XVII — CRM для сервисного бизнеса</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <section id="auth-screen" class="auth-screen" aria-live="polite"></section>
    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="XVII — на главную" data-page="dashboard">
          <span class="brand-mark"><img src="./src/assets/xvii-logo.png" alt="" /></span>
          <span class="brand-copy"><strong>XVII</strong><small>CRM для сервиса</small></span>
        </a>

        <button class="branch-switcher" id="branch-switcher" type="button">
          <span class="branch-avatar">Ц</span>
          <span class="branch-copy"><strong>Центральный</strong><small>Сервисный центр</small></span>
          <svg class="icon"><use href="#i-chevron-down"></use></svg>
        </button>

        <nav class="sidebar-nav" aria-label="Основная навигация">
          <span class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</span>
          <button class="nav-item is-active" data-page="dashboard"><svg class="icon"><use href="#i-grid"></use></svg><span>Обзор</span></button>
          <button class="nav-item" data-page="orders"><svg class="icon"><use href="#i-clipboard"></use></svg><span>Заказы</span></button>
          <button class="nav-item" data-page="customers"><svg class="icon"><use href="#i-users"></use></svg><span>Клиенты</span></button>
          <button class="nav-item" data-page="tasks"><svg class="icon"><use href="#i-check-square"></use></svg><span>Задачи</span><span class="nav-dot" hidden></span></button>
          <button class="nav-item" data-page="calendar"><svg class="icon"><use href="#i-calendar"></use></svg><span>Запись и календарь</span></button>

          <span class="nav-caption nav-caption-spaced">УПРАВЛЕНИЕ</span>
          <button class="nav-item" data-page="inventory"><svg class="icon"><use href="#i-box"></use></svg><span>Склад и товары</span></button>
          <button class="nav-item" data-page="services"><svg class="icon"><use href="#i-tool"></use></svg><span>Услуги и прайс</span></button>
          <button class="nav-item" data-page="finance"><svg class="icon"><use href="#i-wallet"></use></svg><span>Финансы</span></button>
          <button class="nav-item" data-page="team"><svg class="icon"><use href="#i-users"></use></svg><span>Сотрудники</span></button>
          <button class="nav-item" data-page="branches"><svg class="icon"><use href="#i-grid"></use></svg><span>Филиалы и кассы</span></button>

          <span class="nav-caption nav-caption-spaced">ОБСЛУЖИВАНИЕ</span>
          <button class="nav-item" data-page="documents"><svg class="icon"><use href="#i-file"></use></svg><span>Документы</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-icon"><svg class="icon"><use href="#i-grid"></use></svg></span>
            <strong>Общая база XVII</strong>
            <p>Заказы и платежи сохраняются в базе вашей компании.</p>
          </div>
          <button class="nav-item" data-page="billing"><svg class="icon"><use href="#i-wallet"></use></svg><span>Подписка и баланс</span></button>
          <button class="nav-item settings-link" data-page="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>Настройки</span></button>
          <button class="profile-button" id="profile-button" type="button">
            <span class="avatar avatar-purple">АК</span>
            <span class="profile-copy"><strong>Александр Ким</strong><small>Владелец бизнеса</small></span>
            <svg class="icon"><use href="#i-more"></use></svg>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Открыть меню" aria-expanded="false"><svg class="icon"><use href="#i-menu"></use></svg></button>
          <div class="breadcrumb"><span>XVII</span><svg class="icon"><use href="#i-chevron-right"></use></svg><strong id="breadcrumb-current">Обзор</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><svg class="icon"><use href="#i-search"></use></svg><input id="global-search" type="search" placeholder="Поиск по CRM..." autocomplete="off" /><kbd>⌘ K</kbd></label>
            <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Включить тёмную тему"><svg class="icon theme-icon-light"><use href="#i-moon"></use></svg><svg class="icon theme-icon-dark"><use href="#i-sun"></use></svg></button>
            <label class="icon-button accent-picker" title="Изменить акцентный цвет"><svg class="icon"><use href="#i-sparkles"></use></svg><input id="accent-color" type="color" value="#566cf2" aria-label="Изменить акцентный цвет" /></label>
            <button class="date-button" id="date-button" type="button"><svg class="icon"><use href="#i-calendar"></use></svg><span id="current-date"></span></button>
          </div>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div class="modal-root" id="modal-root"></div>
    <div class="popover-root" id="popover-root"></div>

    <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2.5"/><path d="M9 5.5V4a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4v1.5M9 11h6m-6 4h6"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.87m-1-11.26a4 4 0 0 1 0 7.76"/></symbol>
      <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m7.5 12 3 3 6-6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18m-13 4h2m4 0h2m-8 3h2"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 4.5v9L12 21l-9-4.5v-9L12 3Z"/><path d="m3.3 7.7 8.7 4.5 8.7-4.5M12 12.2V21m-4.5-15 9 4.7"/></symbol>
      <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.5 6.5a5 5 0 0 0-6.2 6.2l-5.1 5.1a2.1 2.1 0 1 0 3 3l5.1-5.1a5 5 0 0 0 6.2-6.2l-3 3-3-3 3-3Z"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 5h.01"/><path d="M6 5V4a2 2 0 0 1 2-2h10"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 6-7"/></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-2 2v-7.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Z"/><path d="M13 3v7h7m-11 4h6m-6 4h6"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 16 .9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16Zm-13-1 .7 1.8L8.5 17l-1.8.7L6 19.5l-.7-1.8L3.5 17l1.8-.7L6 15Z"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2A1.7 1.7 0 0 0 5.4 5.8l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2A1.7 1.7 0 0 0 17 3.4l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-trend-up" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-9m-6 0h6v6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
    </svg>
    <script src="./qos-config.js"></script>
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
